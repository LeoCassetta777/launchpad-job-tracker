<!doctype html>
<html>
<!--
  Email layout. Email apps (Outlook especially) ignore most CSS, so this uses
  tables and inline styles. It copies the app's look: cream paper, ink outlines,
  bright stickers.
-->
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"></head>
<body style="margin:0;padding:0;background:#FFF6E5;font-family:Verdana,Arial,sans-serif;color:#1E1E24;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FFF6E5;">
    <tr><td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;">
        <tr><td style="padding:0 0 12px 0;font-size:22px;font-weight:bold;font-family:Arial Black,Arial,sans-serif;">
          🚀 Launchpad
        </td></tr>
        <tr><td style="background:#FFFDF8;border:3px solid #1E1E24;border-radius:18px;padding:20px 22px;">
          {% block body %}{% endblock %}
        </td></tr>
        <tr><td style="padding:14px 4px;font-size:12px;color:#5B5560;">
          Sent by your Launchpad at {{ base_url }}. Change what you get in <a href="{{ base_url }}/settings" style="color:#5B5560;">Settings</a>.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
